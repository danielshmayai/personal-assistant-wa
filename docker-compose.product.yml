# Multi-tenant product stack — API + SPA gateway.
# No GPU/Ollama and no WAHA: web tenants only.
#
# This stack does NOT run its own Postgres. It attaches to the engine's
# network (pa_pa-net) and shares the main Postgres, because product tables
# live alongside the engine tables (see product/config.py). The product
# schema is created automatically on startup via product/db.run_migrations().
#
# Prerequisites:
#   1. The main stack must be up first (it owns Postgres):
#        docker compose up -d
#   2. Build the frontend:
#        cd frontend && npm ci && npm run build
#
# Run under its OWN project name so the two stacks never collide:
#   docker compose -f docker-compose.product.yml -p pa-product up -d

services:
  product-api:
    build:
      context: .
      dockerfile: Dockerfile.product
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pa}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?Set SECRETS_MASTER_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${PRODUCT_BASE_URL:-http://localhost:8080}/auth/google/callback
      PRODUCT_BASE_URL: ${PRODUCT_BASE_URL:-http://localhost:8080}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      VAULT_BASE_DIR: /data/vaults
      LOG_FORMAT: ${LOG_FORMAT:-json}
      USER_TIMEZONE: ${USER_TIMEZONE:-Asia/Jerusalem}
      # Reaches the owner's WhatsApp stack (over pa-net) to notify + let the
      # owner approve new sign-ups by reply. Optional: unset → no notification.
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      MY_WHATSAPP_ID: ${MY_WHATSAPP_ID:-}
    volumes:
      # Bind-mounted to a host folder (not a hidden Docker volume) so each
      # tenant's Obsidian vault is visible on disk and covered by H: backups.
      - ${HOST_TENANT_VAULTS:-H:/Obsidian/tenants}:/data/vaults
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    # pa-net (external) reaches the main Postgres; pa-product-net is the
    # private link to the gateway.
    networks: [pa-net, pa-product-net]

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.product.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - product-api
    networks: [pa-product-net]

networks:
  # The engine's network, created by docker-compose.yml. Shared so product-api
  # can resolve the main Postgres by its "postgres" alias.
  pa-net:
    external: true
    name: pa_pa-net
  pa-product-net:
    driver: bridge
