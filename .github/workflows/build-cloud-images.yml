name: Build new-assistant images

# Builds the new (multi-tenant web) assistant's images for amd64 + arm64 and
# publishes them to GitHub Container Registry:
#   ghcr.io/<owner>/pa-cloud-api:latest      (and :<commit-sha>)
#   ghcr.io/<owner>/pa-cloud-gateway:latest  (and :<commit-sha>)
#
# Cloud servers set up with deploy/cloud/bootstrap.sh pull :latest on their
# own every few minutes (deploy/cloud/update.sh) — no SSH, no deploy secrets.
# Sanity tests gate publishing, so a broken commit never becomes :latest.

on:
  push:
    branches: [main]
    paths:
      - "product/**"
      - "frontend/**"
      - "backend/app/**"
      - "backend/requirements.txt"
      - "Dockerfile.product"
      - "Dockerfile.gateway"
      - "deploy/nginx.product.conf"
      - ".dockerignore"
      - ".github/workflows/build-cloud-images.yml"
  workflow_dispatch:

# A newer push supersedes an in-flight build; :latest always tracks main.
concurrency:
  group: build-cloud-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  sanity:
    name: Sanity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run sanity tests
        working-directory: backend
        run: python -m pytest tests/test_sanity.py -q

  build:
    name: Build (${{ matrix.arch }})
    needs: sanity
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Native ARM (Oracle Ampere) — free GitHub-hosted runner for public repos.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix (registry paths must be lowercase)
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.product
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.PREFIX }}/pa-cloud-api:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

      - name: Build & push gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.PREFIX }}/pa-cloud-gateway:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gateway-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=gateway-${{ matrix.arch }}

  publish:
    name: Publish multi-arch :latest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Image prefix
        run: echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Combine per-arch images into :latest and :<sha>
        run: |
          for img in pa-cloud-api pa-cloud-gateway; do
            docker buildx imagetools create \
              -t "$PREFIX/$img:latest" -t "$PREFIX/$img:${GITHUB_SHA}" \
              "$PREFIX/$img:${GITHUB_SHA}-amd64" "$PREFIX/$img:${GITHUB_SHA}-arm64"
          done

      - name: Visibility check
        run: |
          # Servers pull anonymously. A package that ends up private (GitHub's
          # default for a brand-new package) makes every pull fail.
          for img in pa-cloud-api pa-cloud-gateway; do
            if docker logout ghcr.io >/dev/null 2>&1 && docker buildx imagetools inspect "$PREFIX/$img:latest" >/dev/null 2>&1; then
              echo "$img: publicly pullable"
            else
              echo "::warning::$img is not publicly pullable. Make it public once: GitHub profile → Packages → $img → Package settings → Change visibility → Public."
            fi
          done
