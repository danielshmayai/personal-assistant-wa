name: Deploy to PA Server

on:
  push:
    branches:
      - main
  # Allow manual deploys from the GitHub Actions UI
  workflow_dispatch:

# Prevent concurrent deploys — if a new push arrives while deploying,
# cancel the in-progress run rather than queue behind it.
concurrency:
  group: deploy-production
  cancel-in-progress: true

# Minimal GitHub token permissions — this workflow only reads repo content.
permissions:
  contents: read

jobs:
  sanity:
    name: Sanity Tests
    runs-on: [self-hosted, pa]

    steps:
      - name: Pull latest code
        shell: powershell
        run: |
          cd D:\Claude\pa
          git fetch origin main
          git reset --hard origin/main

      - name: Run sanity tests
        shell: powershell
        run: |
          cd D:\Claude\pa\backend
          if (-not (Test-Path ".venv\Scripts\python.exe")) {
            Write-Host "venv missing - please recreate it manually as the shmay user."
            exit 1
          }
          # Check if key packages are importable — skip pip install when they are.
          # The machine also runs Docker containers (PA, WAHA, Postgres, Ollama) so
          # available RAM is limited. Running pip install when packages are already
          # present has caused OOM crashes that kill the runner process.
          $pkgCheck = .venv\Scripts\python.exe -c "import fastapi, langchain_core, psycopg2, langchain_google_genai, langgraph, edge_tts, tinytuya, httpx; print('ok')" 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "All packages present — skipping pip install."
          } else {
            Write-Host "Packages missing ($pkgCheck) — running pip install..."
            .venv\Scripts\python.exe -m pip install --prefer-binary -q -r requirements.txt -r requirements-dev.txt
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          .venv\Scripts\python.exe -m pytest tests/test_sanity.py -v

  deploy:
    name: Pull & Rebuild Backend
    runs-on: [self-hosted, pa]
    needs: sanity
    # Require the DEPLOY_GATE secret to match a known value.
    # Set DEPLOY_GATE in GitHub repo → Settings → Secrets to any non-empty string.
    # This prevents a compromised GitHub account token from auto-deploying without
    # also having access to the Secrets store.
    env:
      DEPLOY_GATE: ${{ secrets.DEPLOY_GATE }}

    steps:
      - name: Verify deploy gate
        shell: powershell
        run: |
          if (-not $env:DEPLOY_GATE) {
            Write-Host "DEPLOY_GATE secret is not set - deployment blocked."
            exit 1
          }
          Write-Host "Deploy gate verified."

      - name: Pull latest code
        shell: powershell
        run: |
          cd D:\Claude\pa
          git fetch origin main
          git reset --hard origin/main

      - name: Generate recent changes for PA capabilities
        shell: powershell
        run: |
          cd D:\Claude\pa
          # Collect functional commits from the last 90 days, filter by conventional-commit prefix
          $raw = git log --format="%h|%as|%s" --no-merges --since="90 days ago"
          $entries = @($raw | Where-Object {
            $_ -match "\|(feat|fix|add|new|improve|update|enable|support)[:( ]"
          } | Select-Object -First 30 | ForEach-Object {
            $parts = $_ -split "\|", 3
            [PSCustomObject]@{ sha = $parts[0]; date = $parts[1]; message = $parts[2] }
          })
          $json = ConvertTo-Json $entries -Compress -Depth 3
          Set-Content -Path "backend\app\memory\recent_changes.json" -Value $json -Encoding UTF8
          Write-Host "Wrote $($entries.Count) recent changes to recent_changes.json"

      - name: Rebuild and restart backend
        shell: powershell
        run: |
          cd D:\Claude\pa
          # DOCKER_BUILDKIT=1 enables BuildKit so the pip cache mount in the
          # Dockerfile keeps downloaded wheels between builds.
          $env:DOCKER_BUILDKIT = "1"
          $env:COMPOSE_DOCKER_CLI_BUILD = "1"
          docker compose up --build -d backend

      - name: Verify backend is healthy
        shell: powershell
        run: |
          cd D:\Claude\pa
          Write-Host "Waiting for backend health check..."
          $healthy = $false
          for ($i = 1; $i -le 12; $i++) {
            $status = docker inspect --format='{{.State.Health.Status}}' pa-backend 2>$null
            Write-Host "  attempt $i`: $status"
            if ($status -eq "healthy") {
              Write-Host "Backend is healthy."
              $healthy = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) {
            Write-Host "Backend did not become healthy within 60s."
            docker logs pa-backend --tail 40
            exit 1
          }

      - name: Notify WhatsApp (success)
        if: success()
        shell: powershell
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $apiKey  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_API_KEY=' })  -replace '^WAHA_API_KEY=',''
          $chatId  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^MY_WHATSAPP_ID=' }) -replace '^MY_WHATSAPP_ID=',''
          $session = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_SESSION=' })   -replace '^WAHA_SESSION=',''
          if (-not $session) { $session = "default" }
          for ($i = 1; $i -le 12; $i++) {
            $s = (Invoke-RestMethod -Uri "http://localhost:3000/api/sessions/$session" -Headers @{"X-Api-Key"=$apiKey} -ErrorAction SilentlyContinue).status
            if ($s -eq "WORKING") { break }
            Write-Host "WAHA session status: $s - waiting..."; Start-Sleep -Seconds 5
          }
          $sha = $env:COMMIT_SHA.Substring(0, 7)
          $msg = $env:COMMIT_MSG -split "`n" | Select-Object -First 1
          $body = @{ chatId = $chatId; text = "[PA Deploy] SUCCESS`n${sha}: ${msg}"; session = $session } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "http://localhost:3000/api/sendText" -Method Post -ContentType "application/json" -Headers @{"X-Api-Key"=$apiKey} -Body $body
          } catch {
            Write-Host "WhatsApp notification skipped: $_"
          }

      - name: Notify WhatsApp (failure)
        if: failure()
        shell: powershell
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          $apiKey  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_API_KEY=' })  -replace '^WAHA_API_KEY=',''
          $chatId  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^MY_WHATSAPP_ID=' }) -replace '^MY_WHATSAPP_ID=',''
          $session = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_SESSION=' })   -replace '^WAHA_SESSION=',''
          if (-not $session) { $session = "default" }
          for ($i = 1; $i -le 12; $i++) {
            $s = (Invoke-RestMethod -Uri "http://localhost:3000/api/sessions/$session" -Headers @{"X-Api-Key"=$apiKey} -ErrorAction SilentlyContinue).status
            if ($s -eq "WORKING") { break }
            Write-Host "WAHA session status: $s - waiting..."; Start-Sleep -Seconds 5
          }
          $sha = $env:COMMIT_SHA.Substring(0, 7)
          $msg = $env:COMMIT_MSG -split "`n" | Select-Object -First 1
          $body = @{ chatId = $chatId; text = "[PA Deploy] FAILED`n${sha}: ${msg}`nCheck: https://github.com/$env:REPO/actions"; session = $session } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "http://localhost:3000/api/sendText" -Method Post -ContentType "application/json" -Headers @{"X-Api-Key"=$apiKey} -Body $body
          } catch {
            Write-Host "WhatsApp notification skipped: $_"
          }

  deploy-product:
    name: Pull & Rebuild Product Stack (new assistant)
    runs-on: [self-hosted, pa]
    needs: deploy
    # Require the DEPLOY_GATE secret to match a known value — same gate as
    # the old-assistant deploy job above.
    env:
      DEPLOY_GATE: ${{ secrets.DEPLOY_GATE }}

    steps:
      - name: Verify deploy gate
        shell: powershell
        run: |
          if (-not $env:DEPLOY_GATE) {
            Write-Host "DEPLOY_GATE secret is not set - deployment blocked."
            exit 1
          }
          Write-Host "Deploy gate verified."

      - name: Pull latest code
        shell: powershell
        run: |
          cd D:\Claude\pa
          git fetch origin main
          git reset --hard origin/main

      - name: Check product stack is initialised on this host
        id: check
        shell: powershell
        run: |
          cd D:\Claude\pa
          # The product stack is opt-in (its own .env values: SESSION_SECRET,
          # SECRETS_MASTER_KEY, GOOGLE_CLIENT_ID/SECRET, etc.). Skip quietly
          # until the operator has set it up and started it at least once, so
          # a fresh clone or an operator who hasn't opted in yet never fails CI.
          $envExists = Test-Path ".env"
          $containerExists = [bool](docker ps -a --filter "name=^pa-product-api$" --format "{{.Names}}")
          if (-not $envExists -or -not $containerExists) {
            Write-Host "Product stack not yet initialised (env exists=$envExists, container exists=$containerExists) - skipping."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build frontend (Vite SPA)
        if: steps.check.outputs.skip != 'true'
        shell: powershell
        run: |
          cd D:\Claude\pa
          # Build inside a throwaway Node container — no Node.js install
          # required on the runner host, matches the old assistant's
          # container-first deploy approach.
          docker run --rm -v "${PWD}/frontend:/app" -w /app node:20-alpine sh -c "npm ci && npm run build"

      - name: Rebuild and restart product stack
        if: steps.check.outputs.skip != 'true'
        shell: powershell
        run: |
          cd D:\Claude\pa
          $env:DOCKER_BUILDKIT = "1"
          $env:COMPOSE_DOCKER_CLI_BUILD = "1"
          docker compose -f docker-compose.product.yml -p pa-product up --build -d

      - name: Verify product stack is healthy
        if: steps.check.outputs.skip != 'true'
        shell: powershell
        run: |
          cd D:\Claude\pa
          Write-Host "Waiting for product-api health check..."
          $healthy = $false
          for ($i = 1; $i -le 12; $i++) {
            $status = docker inspect --format='{{.State.Health.Status}}' pa-product-api 2>$null
            Write-Host "  attempt $i`: $status"
            if ($status -eq "healthy") {
              $healthy = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) {
            Write-Host "Product API did not become healthy within 60s."
            docker logs pa-product-api --tail 40
            exit 1
          }
          Write-Host "Verifying gateway proxies /health end-to-end..."
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:8080/health" -UseBasicParsing -TimeoutSec 10
            Write-Host "Gateway /health -> $($resp.StatusCode)"
          } catch {
            Write-Host "Gateway health check failed: $_"
            docker logs pa-product-gateway --tail 40
            exit 1
          }

      - name: Notify WhatsApp (success)
        if: success() && steps.check.outputs.skip != 'true'
        shell: powershell
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $apiKey  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_API_KEY=' })  -replace '^WAHA_API_KEY=',''
          $chatId  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^MY_WHATSAPP_ID=' }) -replace '^MY_WHATSAPP_ID=',''
          $session = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_SESSION=' })   -replace '^WAHA_SESSION=',''
          if (-not $session) { $session = "default" }
          $sha = $env:COMMIT_SHA.Substring(0, 7)
          $msg = $env:COMMIT_MSG -split "`n" | Select-Object -First 1
          $body = @{ chatId = $chatId; text = "[PA Product Deploy] SUCCESS`n${sha}: ${msg}"; session = $session } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "http://localhost:3000/api/sendText" -Method Post -ContentType "application/json" -Headers @{"X-Api-Key"=$apiKey} -Body $body
          } catch {
            Write-Host "WhatsApp notification skipped: $_"
          }

      - name: Notify WhatsApp (failure)
        if: failure() && steps.check.outputs.skip != 'true'
        shell: powershell
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          REPO: ${{ github.repository }}
        run: |
          $apiKey  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_API_KEY=' })  -replace '^WAHA_API_KEY=',''
          $chatId  = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^MY_WHATSAPP_ID=' }) -replace '^MY_WHATSAPP_ID=',''
          $session = (Get-Content D:\Claude\pa\.env | Where-Object { $_ -match '^WAHA_SESSION=' })   -replace '^WAHA_SESSION=',''
          if (-not $session) { $session = "default" }
          $sha = $env:COMMIT_SHA.Substring(0, 7)
          $msg = $env:COMMIT_MSG -split "`n" | Select-Object -First 1
          $body = @{ chatId = $chatId; text = "[PA Product Deploy] FAILED`n${sha}: ${msg}`nCheck: https://github.com/$env:REPO/actions"; session = $session } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri "http://localhost:3000/api/sendText" -Method Post -ContentType "application/json" -Headers @{"X-Api-Key"=$apiKey} -Body $body
          } catch {
            Write-Host "WhatsApp notification skipped: $_"
          }
