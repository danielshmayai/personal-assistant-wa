<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Personal Assistant</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PA">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root {
  --bg:          #F0F2F7;
  --bg2:         #FFFFFF;
  --bg3:         #F5F6FA;
  --bg4:         #FFFFFF;
  --border:      rgba(0,0,0,0.07);
  --border2:     rgba(0,0,0,0.11);
  --user-1:      #4F46E5;
  --user-2:      #7C3AED;
  --accent:      #6366F1;
  --accent-dim:  rgba(99,102,241,0.10);
  --green:       #10B981;
  --red:         #EF4444;
  --text:        #111827;
  --text2:       #6B7280;
  --text3:       #9CA3AF;
  --radius:      16px;
  --radius-sm:   12px;
  --shadow:      0 4px 24px rgba(0,0,0,.10);
  --shadow-sm:   0 2px 8px rgba(0,0,0,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Login ── */
#login-screen {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 30%, #EEF0FF 0%, #F0F2F7 72%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.login-card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 40px 40px 36px;
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: var(--shadow);
}
.login-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.login-icon {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 28px rgba(99,102,241,.4);
}
.login-icon svg { color: #fff; }
.login-card h1 {
  font-family: "Outfit", sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  text-align: center;
  letter-spacing: -.02em;
}
.login-subtitle {
  font-size: 13px;
  color: var(--text2);
  text-align: center;
  margin-top: -4px;
  margin-bottom: 4px;
}
.login-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.login-field label { font-size: 13px; font-weight: 500; color: var(--text2); }
.login-card input[type=password] {
  background: var(--bg3);
  border: 1.5px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  padding: 12px 16px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  width: 100%;
}
.login-card input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
.login-card input[type=password]::placeholder { color: var(--text3); }
#login-btn {
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 13px;
  margin-top: 8px;
  transition: opacity .15s, transform .1s, box-shadow .15s;
  box-shadow: 0 4px 16px rgba(99,102,241,.38);
}
#login-btn:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 22px rgba(99,102,241,.48); }
#login-btn:active { transform: translateY(0); }
#login-error { color: var(--red); font-size: 13px; text-align: center; margin-top: 4px; }

/* ── App ── */
#app { display: grid; grid-template-columns: 260px 1fr; height: 100dvh; }

/* ── Sidebar ── */
#sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header { padding: 16px 14px 14px; border-bottom: 1px solid var(--border); }
.sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.brand-icon {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(99,102,241,.3);
}
.brand-icon svg { color: #fff; }
.brand-name { font-family: "Outfit", sans-serif; font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
#new-chat-btn {
  width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--accent-dim);
  border: 1px solid rgba(99,102,241,.25);
  border-radius: var(--radius-sm);
  color: var(--accent);
  cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 600;
  padding: 9px 16px;
  transition: background .15s, border-color .15s;
}
#new-chat-btn:hover { background: rgba(99,102,241,.22); border-color: rgba(99,102,241,.4); }
.sidebar-section-label {
  font-size: 10px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .09em;
  padding: 14px 14px 6px;
}
.muted { color: var(--text3) !important; font-style: italic; border-color: transparent !important; background: transparent !important; font-size: 12px !important; padding: 4px !important; }
#conv-list { flex: 1; overflow-y: auto; padding: 4px 8px 8px; }
.conv-item {
  display: flex; align-items: center;
  padding: 8px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background .12s;
  gap: 8px; border: 1px solid transparent; margin-bottom: 2px;
}
.conv-item:hover { background: var(--bg3); }
.conv-item.active { background: var(--accent-dim); border-color: rgba(99,102,241,.18); }
.conv-item-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; color: var(--text3);
}
.conv-item.active .conv-item-icon { background: var(--accent-dim); color: var(--accent); border-color: rgba(99,102,241,.25); }
.conv-item-body { flex: 1; min-width: 0; }
.conv-item-title { font-size: 12.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.conv-item.active .conv-item-title { color: var(--accent); }
.conv-item-title.untitled { color: var(--text2); font-style: italic; }
.conv-item-time { font-size: 10.5px; color: var(--text3); display: block; margin-top: 1px; }
.conv-empty { color: var(--text3); font-size: 13px; font-style: italic; padding: 20px; text-align: center; }
.conv-item-del {
  background: none; border: none; color: var(--text3); cursor: pointer;
  padding: 4px 5px; border-radius: 6px; display: none;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: color .15s, background .15s;
}
.conv-item:hover .conv-item-del { display: flex; }
.conv-item-del:hover { color: var(--red); background: rgba(239,68,68,.08); }

/* ── Chat main ── */
#chat-main { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); position: relative; }
#chat-header {
  align-items: center; background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; gap: 12px; padding: 0 20px; height: 60px; flex-shrink: 0;
}
.header-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(99,102,241,.35);
}
.header-avatar svg { color: #fff; }
.header-info { flex: 1; }
.header-title { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: -.01em; color: var(--text); line-height: 1.2; }
.header-subtitle { display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; transition: background .3s; }
.status-dot.connected { background: var(--green); box-shadow: 0 0 6px rgba(16,185,129,.5); }
.status-dot.disconnected { background: var(--red); }
.status-dot.error { background: var(--red); }
#status-label { font-size: 11px; color: var(--text3); transition: color .3s; }

/* ── Messages ── */
#messages {
  flex: 1; overflow-y: auto;
  padding: 20px 20px 12px;
  display: flex; flex-direction: column; gap: 3px;
  scroll-behavior: smooth;
}
#messages.drag-over { outline: 2px dashed var(--accent); outline-offset: -8px; }

/* Message rows */
.msg-row { display: flex; align-items: flex-end; gap: 8px; }
.msg-row-user { justify-content: flex-end; }
.msg-row-assistant { justify-content: flex-start; }
.msg-row-user + .msg-row-assistant,
.msg-row-assistant + .msg-row-user { margin-top: 8px; }

.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; align-self: flex-end;
  box-shadow: 0 1px 6px rgba(99,102,241,.25);
}
.msg-avatar svg { color: #fff; }

.message {
  max-width: 72%; padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 14.5px; line-height: 1.65;
  word-break: break-word; position: relative;
}
.message-user {
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  color: #fff; border-bottom-right-radius: 4px;
  white-space: pre-wrap;
  box-shadow: 0 2px 14px rgba(99,102,241,.28);
}
.message-assistant {
  background: var(--bg4); border: 1px solid var(--border2);
  border-bottom-left-radius: 4px; color: var(--text);
  box-shadow: var(--shadow-sm);
}
.message-assistant.streaming { opacity: .9; }
.message-user .msg-time { color: rgba(255,255,255,.5); }

/* Markdown */
.message-assistant h1,.message-assistant h2,.message-assistant h3 { margin: .65em 0 .3em; font-weight: 700; letter-spacing: -.01em; }
.message-assistant h1 { font-size: 1.12em; }
.message-assistant h2 { font-size: 1.04em; }
.message-assistant h3 { font-size: 1em; }
.message-assistant p { margin: .3em 0; }
.message-assistant p:first-child { margin-top: 0; }
.message-assistant p:last-child { margin-bottom: 0; }
.message-assistant ul,.message-assistant ol { padding-left: 1.5em; margin: .3em 0; }
.message-assistant li { margin: .12em 0; }
.message-assistant code:not(pre code) {
  background: rgba(99,102,241,.08); border: 1px solid rgba(99,102,241,.18);
  border-radius: 5px; font-family: "JetBrains Mono", ui-monospace, monospace;
  font-size: .82em; padding: .1em .35em; color: var(--accent);
}
.message-assistant pre { background: #F6F8FA; border: 1px solid var(--border2); border-radius: 10px; margin: .6em 0; overflow-x: auto; }
.message-assistant pre code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; padding: 14px 16px; display: block; background: none; border: none; }
.message-assistant table { border-collapse: collapse; font-size: 13px; margin: .5em 0; width: 100%; }
.message-assistant th,.message-assistant td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; }
.message-assistant th { background: var(--bg3); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); }
.message-assistant blockquote { border-left: 3px solid var(--accent); color: var(--text2); margin: .5em 0; padding: 2px 0 2px 14px; font-style: italic; }
.message-assistant a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.message-assistant a:hover { opacity: .8; }
.message-assistant a[href^="https://wa.me/"] {
  display: inline-flex; align-items: center; gap: 4px;
  background: #25D366; color: #fff; border-radius: 999px;
  padding: 3px 10px; font-size: 0.85rem; text-decoration: none;
  font-weight: 600;
}
.message-assistant a[href^="https://wa.me/"]::before { content: "💬 "; }
.message-assistant a[href^="https://wa.me/"]:hover { opacity: .85; }

/* ── Reasoning block ── */
.reasoning-block {
  margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; overflow: hidden; font-size: 0.8rem; opacity: 0.7;
}
.reasoning-block summary {
  padding: 4px 10px; cursor: pointer; user-select: none;
  background: rgba(255,255,255,0.05); list-style: none;
}
.reasoning-block summary::-webkit-details-marker { display: none; }
.reasoning-block summary::before { content: "▶  "; font-size: 0.65rem; }
details[open].reasoning-block summary::before { content: "▼  "; }
.reasoning-content { padding: 8px 10px; white-space: pre-wrap; word-break: break-word; color: var(--text2); }

/* ── TTS toggle ── */
#tts-toggle-btn {
  background: none; border: none; font-size: 1.1rem; cursor: pointer;
  opacity: 0.35; transition: opacity .2s; line-height: 1; padding: 4px;
  border-radius: 6px; color: var(--text);
}
#tts-toggle-btn:hover { opacity: 0.65; }
#tts-toggle-btn.active { opacity: 1; }

.msg-time { display: block; font-size: 10px; color: var(--text3); margin-top: 4px; text-align: right; }
.message-assistant .msg-time { text-align: left; }

/* Tool badges */
.tool-badge {
  align-self: flex-start;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 999px; color: var(--text2);
  font-size: 12px; font-weight: 500;
  padding: 5px 13px 5px 10px;
  animation: fadeIn .2s ease; transition: opacity .35s;
  display: flex; align-items: center; gap: 7px;
  margin-left: 38px;
}
.tool-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; flex-shrink: 0; }
.tool-badge.done { opacity: 0; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text3); padding: 60px 20px 40px; text-align: center; flex: 1; }
.empty-icon { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, rgba(79,70,229,.18), rgba(124,58,237,.18)); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.empty-icon svg { color: var(--accent); }
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text2); }
.empty-state p { font-size: 13px; max-width: 260px; line-height: 1.55; }

/* Upload preview */
#upload-preview { align-items: center; background: var(--bg2); border-top: 1px solid var(--border); display: flex; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--text2); }
#upload-preview .upload-icon { color: var(--accent); flex-shrink: 0; }
#upload-cancel-btn { background: none; border: none; color: var(--text3); cursor: pointer; padding: 4px 6px; margin-left: auto; border-radius: 6px; transition: color .15s, background .15s; display: flex; align-items: center; }
#upload-cancel-btn:hover { color: var(--red); background: rgba(239,68,68,.08); }

/* ── Input area ── */
#input-area { background: var(--bg2); border-top: 1px solid var(--border); padding: 10px 14px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
#input-form {
  display: flex; align-items: flex-end; gap: 6px;
  background: var(--bg3); border: 1.5px solid var(--border2);
  border-radius: 22px; padding: 5px 5px 5px 10px;
  transition: border-color .15s, box-shadow .15s;
}
#input-form:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
#upload-label { cursor: pointer; color: var(--text3); padding: 6px; display: flex; align-items: center; border-radius: 8px; transition: color .15s, background .15s; flex-shrink: 0; align-self: flex-end; margin-bottom: 1px; }
#upload-label:hover { color: var(--accent); background: var(--accent-dim); }
#message-input { background: transparent; border: none; color: var(--text); flex: 1; font-family: inherit; font-size: 15px; line-height: 1.5; max-height: 160px; outline: none; padding: 6px 4px; resize: none; }
#message-input:disabled { opacity: .4; }
#message-input::placeholder { color: var(--text3); }
#mic-btn { background: none; border: none; border-radius: 10px; color: var(--text3); cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; transition: color .15s, background .15s; align-self: flex-end; }
#mic-btn:hover { color: var(--accent); background: var(--accent-dim); }
#mic-btn.recording { color: var(--red); background: rgba(239,68,68,.10); animation: mic-pulse 1.4s ease-in-out infinite; }
@keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.40); border-radius: 10px; } 60% { box-shadow: 0 0 0 8px rgba(239,68,68,0); border-radius: 10px; } }
#send-btn {
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  border: none; border-radius: 50%; color: #fff; cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px;
  transition: opacity .15s, transform .12s, box-shadow .15s;
  box-shadow: 0 2px 10px rgba(99,102,241,.35); align-self: flex-end;
}
#send-btn:hover { opacity: .9; transform: scale(1.06); box-shadow: 0 4px 16px rgba(99,102,241,.45); }
#send-btn:active { transform: scale(.95); }
#send-btn:disabled { opacity: .28; cursor: default; transform: none; box-shadow: none; }

/* Scroll-to-bottom FAB */
#scroll-btn { position: absolute; bottom: 86px; right: 18px; width: 38px; height: 38px; border-radius: 50%; background: var(--bg2); border: 1px solid var(--border2); color: var(--text2); cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); transition: background .15s, color .15s; z-index: 10; }
#scroll-btn.visible { display: flex; }
#scroll-btn:hover { background: var(--bg4); color: var(--text); }

/* Speak button */
.speak-btn { background: none; border: none; border-radius: 5px; color: var(--text3); cursor: pointer; padding: 2px 4px; opacity: 0; transition: opacity .15s, color .15s; display: inline-flex; align-items: center; vertical-align: middle; margin-left: 4px; flex-shrink: 0; }
.message-assistant:hover .speak-btn { opacity: 1; }
.speak-btn.speaking { opacity: 1; color: var(--accent); }
@media (hover: none) { .speak-btn { opacity: .5; } }

.system-msg { align-self: center; color: var(--text3); font-size: 12px; padding: 3px 0; margin: 4px 0; }
.hidden { display: none !important; }

/* ── Update toast ── */
#update-toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 14px; padding: 11px 14px 11px 16px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: var(--shadow); z-index: 300; white-space: nowrap;
  font-size: 13px; color: var(--text);
  animation: fadeIn .25s ease;
}
#update-toast button {
  background: linear-gradient(135deg, var(--user-1), var(--user-2));
  border: none; border-radius: 8px; color: #fff;
  cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 14px; flex-shrink: 0;
  transition: opacity .15s;
}
#update-toast button:hover { opacity: .88; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,.14); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.24); }

/* ── Leads nav button ── */
.sidebar-divider { height: 1px; background: var(--border); margin: 8px 12px; }
#leads-nav-btn {
  display: flex; align-items: center; gap: 9px;
  width: calc(100% - 16px); margin: 2px 8px;
  background: none; border: 1px solid transparent;
  border-radius: var(--radius-sm); color: var(--text2);
  cursor: pointer; font-family: inherit; font-size: 12.5px; font-weight: 500;
  padding: 8px 10px; transition: background .12s, color .12s, border-color .12s;
  text-align: left;
}
#leads-nav-btn:hover { background: var(--bg3); color: var(--text); }
#leads-nav-btn.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(99,102,241,.18); }
#leads-nav-btn svg { flex-shrink: 0; }

  background: var(--border2); transition: background .2s;
}
.toggle-switch input:checked + .toggle-track { background: var(--accent); }

  content: ''; position: absolute; top: 3px; left: 3px;
  width: 19px; height: 19px; border-radius: 50%;

  box-shadow: 0 1px 4px rgba(0,0,0,.18);

        </button>
        <button type="submit" id="send-btn" title="Send">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </form>
    </div>
  </main>
</div>

<script>
// ── Configure marked ────────────────────────────────────────────────────────
marked.use({
  gfm: true,
  breaks: true,
  renderer: {
    code(token) {
      const lang = token.lang || '';
      const validLang = hljs.getLanguage(lang) ? lang : '';
      const highlighted = validLang
        ? hljs.highlight(token.text, { language: validLang }).value
        : hljs.highlightAuto(token.text).value;
      return `<pre><code class="hljs language-${lang}">${highlighted}</code></pre>`;
    }
  }
});

// ── Constants ───────────────────────────────────────────────────────────────
const AI_AVATAR_SVG = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"/><circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"/></svg>`;

// ── State ───────────────────────────────────────────────────────────────────
let token = localStorage.getItem('pa_token') || '';
let currentChatId = localStorage.getItem('pa_chat_id') || null;
if (!currentChatId) {
  currentChatId = 'web_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Date.now().toString(36));
  localStorage.setItem('pa_chat_id', currentChatId);
}
let ws = null;
let pendingMediaId = null;
let pendingFilename = null;
let activeToolBadges = {};
let currentAiEl = null;
let currentAiRaw = '';
let currentAiTs = '';
let currentThinkingEl = null;
let currentThinkingRaw = '';
let reconnectTimer = null;

// ── DOM refs ────────────────────────────────────────────────────────────────
const loginScreen  = document.getElementById('login-screen');
const appEl        = document.getElementById('app');
const tokenInput   = document.getElementById('token-input');
const loginBtn     = document.getElementById('login-btn');
const loginError   = document.getElementById('login-error');
const statusDot    = document.getElementById('status-dot');
const statusLabel  = document.getElementById('status-label');
const messagesEl   = document.getElementById('messages');
const uploadPreview= document.getElementById('upload-preview');
const uploadFilename= document.getElementById('upload-filename');
const fileInput    = document.getElementById('file-input');
const messageInput = document.getElementById('message-input');
const sendBtn      = document.getElementById('send-btn');
const inputForm    = document.getElementById('input-form');

// ── Auth & connection ───────────────────────────────────────────────────────
function showLogin(err) {
  appEl.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  if (err) {
    loginError.textContent = err;
    loginError.classList.remove('hidden');
  } else {
    loginError.classList.add('hidden');
  }
}

function showApp() {
  loginScreen.classList.add('hidden');
  appEl.classList.remove('hidden');
  loadConversations();
}

function setStatus(state) {
  statusDot.className = 'status-dot ' + state;
  const labels = { connected: 'Connected', disconnected: 'Reconnecting…', error: 'Error' };
  if (statusLabel) statusLabel.textContent = labels[state] || state;
}

function connectWebSocket() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}/ws/chat?token=${encodeURIComponent(token)}&chat_id=${encodeURIComponent(currentChatId)}`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    setStatus('connected');
    showApp();
    localStorage.setItem('pa_token', token);
  };

  ws.onclose = e => {
    setStatus('disconnected');
    ws = null;
    if (e.code === 4403) {
      localStorage.removeItem('pa_token');
      token = '';
      showLogin('Invalid token — please try again.');
    } else {
      reconnectTimer = setTimeout(connectWebSocket, 3000);
    }
  };

  ws.onerror = () => setStatus('error');
  ws.onmessage = e => handleServerMsg(JSON.parse(e.data));
}

loginBtn.addEventListener('click', () => {
  token = tokenInput.value.trim();
  if (token) connectWebSocket();
});
tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

// ── Server message handler ──────────────────────────────────────────────────
function handleServerMsg(msg) {
  switch (msg.type) {
    case 'history':
      renderHistory(msg.messages);
      loadConversations();
      syncTtsToggle();
      break;
    case 'conversation_updated':
      loadConversations();
      break;
    case 'thinking_token':
      appendThinkingToken(msg.content);
      break;
    case 'token':
      appendToken(msg.content);
      break;
    case 'tool_start':
      showToolBadge(msg.name);
      break;
    case 'tool_end':
      hideToolBadge(msg.name);
      break;
    case 'done':
      finalizeAiMsg(msg.full_reply);
      break;
    case 'error':
      finalizeAiMsg('');
      addSystemMsg('⚠️ ' + (msg.message || 'Error'));
      enableInput();
      break;
  }
}

// ── Message rendering ───────────────────────────────────────────────────────
function isRtl(text) {
  return /[\u0590-\u05FF\u0600-\u06FF]/.test(text);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

const SPEAK_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
const STOP_SVG  = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>`;

function attachSpeakBtn(div, getText) {
  const btn = document.createElement('button');
  btn.className = 'speak-btn';
  btn.title = 'Read aloud';
  btn.innerHTML = SPEAK_SVG;
  btn.addEventListener('click', () => speakText(getText(), btn));
  div.appendChild(btn);
}

function formatMsgTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const time = d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  if (isToday) return time;
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  if (d.toDateString() === yesterday.toDateString()) return `Yesterday ${time}`;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + time;
}

function addMessage(role, content, ts) {
  const text = extractText(content);
  const row = document.createElement('div');
  row.className = `msg-row msg-row-${role}`;
  if (role === 'assistant') {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.innerHTML = AI_AVATAR_SVG;
    row.appendChild(av);
  }
  const div = document.createElement('div');
  div.className = `message message-${role}`;
  if (role === 'assistant') {
    div.innerHTML = marked.parse(text || '');
    attachSpeakBtn(div, () => text);
  } else {
    div.textContent = text;
  }
  if (isRtl(text)) div.setAttribute('dir', 'rtl');
  if (ts) {
    const timeEl = document.createElement('span');
    timeEl.className = 'msg-time';
    timeEl.textContent = formatMsgTime(ts);
    div.appendChild(timeEl);
  }
  row.appendChild(div);
  messagesEl.appendChild(row);
  scrollBottom();
  return div;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollBottom();
}

function renderHistory(messages) {
  messagesEl.innerHTML = '';
  activeToolBadges = {};
  currentAiEl = null;
  currentThinkingEl = null;
  currentThinkingRaw = '';
  if (!messages.length) {
    messagesEl.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a4 4 0 0 1 4 4v1h1a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3h1V6a4 4 0 0 1 4-4z"/><circle cx="9" cy="13" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1" fill="currentColor" stroke="none"/></svg></div><h3>How can I help?</h3><p>Ask me anything — Gmail, Calendar, web search, or just a question.</p></div>`;
    return;
  }
  messages.forEach(m => addMessage(m.role, m.content, m.ts));
}

function extractText(val) {
  if (typeof val === 'string') return val;
  if (Array.isArray(val)) return val.map(b => (b && b.text) ? b.text : String(b)).join('');
  if (val && typeof val === 'object' && val.text) return val.text;
  return '';
}

function appendToken(tok) {
  if (!currentAiEl) {
    const row = document.createElement('div');
    row.className = 'msg-row msg-row-assistant';
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.innerHTML = AI_AVATAR_SVG;
    row.appendChild(av);
    currentAiEl = document.createElement('div');
    currentAiEl.className = 'message message-assistant streaming';
    currentAiRaw = '';
    currentAiTs = new Date().toISOString();
    row.appendChild(currentAiEl);
    messagesEl.appendChild(row);
  }
  currentAiRaw += extractText(tok);
  let bodyEl = currentAiEl.querySelector('.ai-text-body');
  if (!bodyEl) {
    bodyEl = document.createElement('div');
    bodyEl.className = 'ai-text-body';
    currentAiEl.appendChild(bodyEl);
  }
  bodyEl.innerHTML = marked.parse(currentAiRaw);
  scrollBottom();
}

function appendThinkingToken(text) {
  if (!currentAiEl) {
    currentAiEl = document.createElement('div');
    currentAiEl.className = 'message message-assistant streaming';
    currentAiRaw = '';
    currentAiTs = new Date().toISOString();
    messagesEl.appendChild(currentAiEl);
  }
  if (!currentThinkingEl) {
    const details = document.createElement('details');
    details.className = 'reasoning-block';
    details.innerHTML = '<summary>Reasoning</summary><div class="reasoning-content"></div>';
    currentAiEl.insertBefore(details, currentAiEl.firstChild);
    currentThinkingEl = details.querySelector('.reasoning-content');
    currentThinkingRaw = '';
  }
  currentThinkingRaw += text;
  currentThinkingEl.textContent = currentThinkingRaw;
  scrollBottom();
}

function finalizeAiMsg(fullReply) {
  if (currentAiEl) {
    currentAiEl.classList.remove('streaming');
    let content = fullReply || currentAiRaw;

    // Extract inline <think>...</think> blocks (used by non-Gemini models)
    if (content) {
      const thinkRe = /<think>([\s\S]*?)<\/think>/gi;
      let thinkContent = '';
      let match;
      while ((match = thinkRe.exec(content)) !== null) thinkContent += match[1] + '\n';
      const cleanContent = content.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();

      if (thinkContent && !currentThinkingEl) {
        const details = document.createElement('details');
        details.className = 'reasoning-block';
        details.innerHTML = '<summary>Reasoning</summary><div class="reasoning-content"></div>';
        currentAiEl.insertBefore(details, currentAiEl.firstChild);
        details.querySelector('.reasoning-content').textContent = thinkContent.trim();
      }
      content = cleanContent || content;
    }

    if (content) {
      // Render markdown into a .ai-text-body wrapper if not already there
      let bodyEl = currentAiEl.querySelector('.ai-text-body');
      if (!bodyEl) {
        bodyEl = document.createElement('div');
        bodyEl.className = 'ai-text-body';
        currentAiEl.appendChild(bodyEl);
      }
      bodyEl.innerHTML = marked.parse(content);
      bodyEl.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
      if (isRtl(content)) currentAiEl.setAttribute('dir', 'rtl');
      attachSpeakBtn(currentAiEl, () => content);
      if (getAutoSpeak()) speakText(content, null);
    }
    if (currentAiTs) {
      const timeEl = document.createElement('span');
      timeEl.className = 'msg-time';
      timeEl.textContent = formatMsgTime(currentAiTs);
      currentAiEl.appendChild(timeEl);
    }
    currentAiEl = null;
    currentAiRaw = '';
    currentAiTs = '';
    currentThinkingEl = null;
    currentThinkingRaw = '';
  }
  Object.values(activeToolBadges).forEach(el => el.remove());
  activeToolBadges = {};
  enableInput();
}

function showToolBadge(name) {
  const labels = {
    _planner: '🧠 Planning…',
    _verifier: '✅ Verifying…',
    web_search: '🔍 Searching web',
    wikipedia_search: '📖 Wikipedia',
    fetch_url: '🌐 Fetching page',
    get_weather: '🌤️ Weather',
    gmail_read: '📧 Reading Gmail',
    gmail_send: '📤 Sending email',
    calendar_list: '📅 Calendar',
    calendar_create: '📅 Creating event',
    drive_save_photo: '📸 Saving to Drive',
    drive_save_document: '📄 Saving to Drive',
    drive_list_files: '📁 Drive files',
    save_fact: '💾 Saving fact',
    update_rule: '📌 Saving rule',
    retrieve_context: '🔎 Searching memory',
    list_memory: '🧠 Memory',
    hide_fact: '🙈 Hiding fact',
    hide_rule: '🙈 Hiding rule',
    list_tuya_devices: '🏠 Smart home',
    get_device_status: '🏠 Device status',
    control_device: '🏠 Controlling device',
    google_connect: '🔗 Google auth',
    build_whatsapp_link: '💬 WhatsApp link',
  };
  if (activeToolBadges[name]) return;
  const badge = document.createElement('div');
  badge.className = 'tool-badge';
  badge.innerHTML = `<span class="tool-badge-dot"></span>${labels[name] || '⚙️ ' + name}`;
  messagesEl.appendChild(badge);
  activeToolBadges[name] = badge;
  scrollBottom();
}

function hideToolBadge(name) {
  const badge = activeToolBadges[name];
  if (!badge) return;
  badge.classList.add('done');
  setTimeout(() => { badge.remove(); delete activeToolBadges[name]; }, 450);
}

// ── Send ────────────────────────────────────────────────────────────────────
inputForm.addEventListener('submit', e => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (!text && !pendingMediaId) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;

  const displayText = pendingFilename
    ? `📎 ${pendingFilename}${text ? '\n' + text : ''}`
    : text;
  addMessage('user', displayText, new Date().toISOString());

  ws.send(JSON.stringify({ type: 'message', text, media_id: pendingMediaId || null }));

  messageInput.value = '';
  messageInput.style.height = 'auto';
  pendingMediaId = null;
  pendingFilename = null;
  hideUploadPreview();
  disableInput();
});

messageInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 200) + 'px';
});

messageInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    inputForm.dispatchEvent(new Event('submit'));
  }
});

function disableInput() {
  sendBtn.disabled = true;
  messageInput.disabled = true;
}

function enableInput() {
  sendBtn.disabled = false;
  messageInput.disabled = false;
  messageInput.focus();
}

// ── File upload ─────────────────────────────────────────────────────────────
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) doUpload(file);
});

document.getElementById('upload-cancel-btn').addEventListener('click', () => {
  pendingMediaId = null;
  pendingFilename = null;
  fileInput.value = '';
  hideUploadPreview();
});

async function doUpload(file) {
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` },
      body: form,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    pendingMediaId = data.media_id;
    pendingFilename = data.filename;
    showUploadPreview(data.filename);
  } catch (err) {
    addSystemMsg(`⚠️ Upload failed: ${err.message}`);
  }
}

function showUploadPreview(fname) {
  uploadFilename.textContent = fname;
  uploadPreview.classList.remove('hidden');
}

function hideUploadPreview() {
  uploadPreview.classList.add('hidden');
  uploadFilename.textContent = '';
}

// Drag-and-drop onto messages area
messagesEl.addEventListener('dragover', e => { e.preventDefault(); messagesEl.classList.add('drag-over'); });
messagesEl.addEventListener('dragleave', () => messagesEl.classList.remove('drag-over'));
messagesEl.addEventListener('drop', e => {
  e.preventDefault();
  messagesEl.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) doUpload(file);
});

// ── Conversations ────────────────────────────────────────────────────────────
function relTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const sec = Math.floor((Date.now() - d) / 1000);
  if (sec < 60) return 'just now';
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}m ago`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr}h ago`;
  const day = Math.floor(hr / 24);
  if (day === 1) return 'yesterday';
  if (day < 7) return `${day}d ago`;
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

async function loadConversations() {
  try {
    const res = await fetch('/api/conversations', { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return;
    renderConversations(await res.json());
  } catch { /* silent */ }
}

function renderConversations(convs) {
  const list = document.getElementById('conv-list');
  if (!convs.length) {
    list.innerHTML = '<div class="conv-empty">No conversations yet</div>';
    return;
  }
  list.innerHTML = convs.map(c => {
    const isNew = !c.title || c.title === 'New conversation';
    return `<div class="conv-item${c.id === currentChatId ? ' active' : ''}" data-id="${escHtml(c.id)}">
      <div class="conv-item-icon">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="conv-item-body">
        <span class="conv-item-title${isNew ? ' untitled' : ''}">${escHtml(c.title || 'New conversation')}</span>
        <span class="conv-item-time">${relTime(c.updated_at)}</span>
      </div>
      <button class="conv-item-del" data-id="${escHtml(c.id)}" title="Delete">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </button>
    </div>`;
  }).join('');
}

document.getElementById('conv-list').addEventListener('click', e => {
  const delBtn = e.target.closest('.conv-item-del');
  if (delBtn) { e.stopPropagation(); deleteConversation(delBtn.dataset.id); return; }
  const item = e.target.closest('.conv-item');
  if (item) switchConversation(item.dataset.id);
});

async function deleteConversation(id) {
  if (!confirm('Delete this conversation? This cannot be undone.')) return;
  try {
    const res = await fetch(`/api/conversations/${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    if (id === currentChatId) {
      currentChatId = 'web_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Date.now().toString(36));
      localStorage.setItem('pa_chat_id', currentChatId);
      if (ws) { ws.onclose = null; ws.close(); ws = null; }
      connectWebSocket();
    } else {
      loadConversations();
    }
  } catch (err) {
    addSystemMsg('⚠️ Delete failed: ' + err.message);
  }
}

function switchConversation(id) {
  if (id === currentChatId && ws && ws.readyState === WebSocket.OPEN) {
    if (window.innerWidth <= 640) closeSidebar();
    return;
  }
  currentChatId = id;
  localStorage.setItem('pa_chat_id', id);
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  connectWebSocket();
  if (window.innerWidth <= 640) closeSidebar();
}

document.getElementById('new-chat-btn').addEventListener('click', () => {
  currentChatId = 'web_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : Date.now().toString(36));
  localStorage.setItem('pa_chat_id', currentChatId);
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  connectWebSocket();
  if (window.innerWidth <= 640) closeSidebar();
});

// ── Helpers ─────────────────────────────────────────────────────────────────
function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// ── Scroll-to-bottom FAB ─────────────────────────────────────────────────────
const scrollBtn = document.getElementById('scroll-btn');
messagesEl.addEventListener('scroll', () => {
  const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  scrollBtn.classList.toggle('visible', !atBottom);
});
scrollBtn.addEventListener('click', scrollBottom);

// ── Voice: STT (faster-whisper via backend) + TTS (SpeechSynthesis) ─────────
let mediaRecorder  = null;
let audioChunks    = [];
function getAutoSpeak() { return localStorage.getItem(`pa_autospeak_${currentChatId}`) === '1'; }
function setAutoSpeak(val) {
  if (currentChatId) localStorage.setItem(`pa_autospeak_${currentChatId}`, val ? '1' : '0');
  const btn = document.getElementById('tts-toggle-btn');
  if (btn) btn.classList.toggle('active', val);
  // Speak a test phrase immediately so the user hears confirmation (and primes the speech engine)
  if (val) speakText('Voice reading on', null);
}
function toggleTts() { setAutoSpeak(!getAutoSpeak()); }
function syncTtsToggle() {
  const btn = document.getElementById('tts-toggle-btn');
  if (btn) btn.classList.toggle('active', getAutoSpeak());
}
let activeSpeakBtn = null;
let activeAudio = null;
let ttsAbortController = null;
const micBtn       = document.getElementById('mic-btn');
const defaultPlaceholder = messageInput.placeholder;

// Hide mic button on non-secure contexts (HTTP) — getUserMedia requires HTTPS
if (!window.isSecureContext) {
  micBtn.style.display = 'none';
}

// Pick the best supported MIME type for recording
const AUDIO_MIME = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus']
  .find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';

micBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else {
    startRecording();
  }
});

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const opts = AUDIO_MIME ? { mimeType: AUDIO_MIME } : {};
    mediaRecorder = new MediaRecorder(stream, opts);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start();
    micBtn.classList.add('recording');
    messageInput.placeholder = 'Recording… tap mic to stop';
  } catch {
    addSystemMsg('⚠️ Microphone access denied');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    mediaRecorder.stream.getTracks().forEach(t => t.stop());
  }
  micBtn.classList.remove('recording');
  messageInput.placeholder = defaultPlaceholder;
}

async function handleRecordingStop() {
  const mime = (audioChunks[0] && audioChunks[0].type) || AUDIO_MIME || 'audio/webm';
  const blob = new Blob(audioChunks, { type: mime });
  audioChunks = [];

  messageInput.placeholder = 'Transcribing…';
  messageInput.disabled = true;
  micBtn.disabled = true;

  try {
    const ext = mime.includes('mp4') ? 'mp4' : mime.includes('ogg') ? 'ogg' : 'webm';
    const form = new FormData();
    form.append('file', blob, `audio.${ext}`);
    const res = await fetch('/api/stt', {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}` },
      body: form,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { text } = await res.json();
    if (text) {
      messageInput.value = text;
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 200) + 'px';
      inputForm.dispatchEvent(new Event('submit'));
    }
  } catch (err) {
    addSystemMsg('⚠️ Transcription failed: ' + err.message);
  } finally {
    messageInput.disabled = false;
    micBtn.disabled = false;
    messageInput.placeholder = defaultPlaceholder;
  }
}

// ── TTS via backend edge-tts (/api/tts) ──────────────────────────────────────
async function speakText(text, btn) {
  // Abort any in-progress fetch and stop any playing audio
  if (ttsAbortController) { ttsAbortController.abort(); ttsAbortController = null; }
  if (activeAudio) { activeAudio.pause(); activeAudio.src = ''; activeAudio = null; }
  if (activeSpeakBtn) {
    activeSpeakBtn.innerHTML = SPEAK_SVG;
    activeSpeakBtn.classList.remove('speaking');
    activeSpeakBtn = null;
  }

  const plain = text.replace(/```[\s\S]*?```/g, 'code block').replace(/[*_~`#>]/g, '');
  if (!plain.trim()) return;

  const ac = new AbortController();
  ttsAbortController = ac;

  if (btn) {
    btn.innerHTML = STOP_SVG;
    btn.classList.add('speaking');
    activeSpeakBtn = btn;
    btn.onclick = () => {
      ac.abort();
      if (activeAudio) { activeAudio.pause(); activeAudio.src = ''; activeAudio = null; }
      btn.innerHTML = SPEAK_SVG;
      btn.classList.remove('speaking');
      btn.onclick = () => speakText(text, btn);
      if (activeSpeakBtn === btn) activeSpeakBtn = null;
    };
  }

  const resetBtn = () => {
    if (btn) {
      btn.innerHTML = SPEAK_SVG;
      btn.classList.remove('speaking');
      btn.onclick = () => speakText(text, btn);
      if (activeSpeakBtn === btn) activeSpeakBtn = null;
    }
    if (ttsAbortController === ac) ttsAbortController = null;
  };

  try {
    const res = await fetch('/api/tts?' + new URLSearchParams({ text: plain }), {
      headers: { Authorization: `Bearer ${token}` },
      signal: ac.signal,
    });
    if (!res.ok) throw new Error(`TTS ${res.status}`);
    const blob = await res.blob();
    if (ac.signal.aborted) return;

    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    activeAudio = audio;

    const cleanup = () => {
      URL.revokeObjectURL(url);
      if (activeAudio === audio) activeAudio = null;
      resetBtn();
    };
    audio.onended = cleanup;
    audio.onerror = cleanup;
    await audio.play();
  } catch (e) {
    if (e.name !== 'AbortError') console.warn('[TTS]', e);
    if (activeAudio) activeAudio = null;
    resetBtn();
  }
}

// ── Service Worker registration & update flow ────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(registration => {

    // Called whenever a new SW is found (install triggered).
    registration.addEventListener('updatefound', () => {
      const newWorker = registration.installing;

      newWorker.addEventListener('statechange', () => {
        // Only show the toast when:
        //  - the new SW has fully installed and is waiting, AND
        //  - there is already a controller (i.e. this isn't the very first install)
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateToast(registration);
        }
      });
    });

  }).catch(err => console.warn('SW registration failed:', err));

  // When the active SW changes (after skipWaiting + clients.claim), reload.
  // This fires after the user clicks "Update" and the new SW takes control.
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; window.location.reload(); }
  });
}

const smarthomePanel  = document.getElementById('smarthome-panel');

let shDevices        = [];
let shStatuses       = {};
let shPendingControls = {};
let shRefreshTimer   = null;

const DEVICE_ICONS = {
  // Lights
  dj: '💡', dc: '✨', tgq: '💡', gyd: '💡', fwd: '💡', dd: '💡', xdd: '💡', sxd: '💡',
  // Switches / outlets
  kg: '🔌', cz: '🔌', pc: '🔌', dlq: '🔌', tdq: '🔌',
  // AC / climate
  kt: '❄️', wk: '🌡️', wkf: '🌡️',
  // Fan
  fs: '🌀', fsd: '🌀',
  // Curtain / blind
  cl: '🪟', clkg: '🪟', ckmfr: '🪟', cjkg: '🪟',
  // Sensor / other
  pir: '👁️', co2bj: '🌬️', wsdcg: '🌡️',

const LIGHT_CATS   = new Set(['dj','dc','tgq','gyd','fwd','dd','xdd','sxd']);

const FAN_CATS     = new Set(['fs','fsd']);
const CURTAIN_CATS = new Set(['cl','clkg','ckmfr','cjkg']);

function shIcon(cat) { return DEVICE_ICONS[cat] || '🏠'; }
function shIsLight(cat)   { return LIGHT_CATS.has(cat); }
function shIsAC(cat)      { return AC_CATS.has(cat); }
function shIsFan(cat)     { return FAN_CATS.has(cat); }
function shIsCurtain(cat) { return CURTAIN_CATS.has(cat); }

const AC_MODES  = ['cool','heat','fan','dry','auto'];
const FAN_SPEEDS = ['low','medium','high','auto'];

function openSmartHome() {

async function shFetch(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

function showShState(state) {
  document.getElementById('sh-loading').classList.toggle('hidden', state !== 'loading');
  document.getElementById('sh-error').classList.toggle('hidden', state !== 'error');
  document.getElementById('device-grid').classList.toggle('hidden', state !== 'grid');
  document.getElementById('sh-empty').classList.toggle('hidden', state !== 'empty');
}

async function loadSmartHomeDevices() {
  showShState('loading');
  try {
    shDevices = await shFetch('/api/devices');
    if (!shDevices.length) { showShState('empty'); return; }
    const results = await Promise.allSettled(
      shDevices.map(d =>
        shFetch(`/api/devices/${encodeURIComponent(d.id)}/status`).then(s => ({ id: d.id, status: s }))
      )
    );
    shStatuses = {};
    results.forEach(r => { if (r.status === 'fulfilled') shStatuses[r.value.id] = r.value.status; });
    showShState('grid');
    renderDeviceGrid();
  } catch (err) {
    document.getElementById('sh-error-msg').textContent = `Failed to load devices: ${err.message}`;
    showShState('error');
  }
}

async function refreshSmartHomeStatuses() {
  if (!shDevices.length) return;
  const results = await Promise.allSettled(
    shDevices.map(d =>
      shFetch(`/api/devices/${encodeURIComponent(d.id)}/status`).then(s => ({ id: d.id, status: s }))
    )
  );
  results.forEach(r => { if (r.status === 'fulfilled') shStatuses[r.value.id] = r.value.status; });
  shDevices.forEach(d => { if (!shPendingControls[d.id]) updateCardControls(d.id); });
}

function renderDeviceGrid() {
  const grid = document.getElementById('device-grid');
  grid.innerHTML = '';
  shDevices.forEach(d => grid.appendChild(buildDeviceCard(d)));
}

// Returns all switch-type DPS keys in a status dict, sorted numerically
function shSwitchKeys(st) {
  return Object.keys(st)
    .filter(k => /^switch(_\d+|_led|)?$/.test(k))
    .sort((a, b) => {
      const n = k => parseInt(k.replace(/\D/g, '') || '0');
      return n(a) - n(b);
    });
}

function shToggleLabel(key, idx, total, isOn, online) {
  if (!online) return 'Offline';
  if (total === 1) return isOn ? 'On' : 'Off';
  if (key === 'switch_led') return 'LED';
  return `Channel ${idx + 1}`;
}

function buildDeviceCard(device) {
  const { id, name, category, online } = device;
  const st    = shStatuses[id] || {};
  const light = shIsLight(category);
  const hasBright = light && st.bright_value !== undefined;
  const hasTemp   = light && st.temp_value   !== undefined;

  const switchKeys  = shSwitchKeys(st);
  const effectiveKeys = switchKeys.length ? switchKeys : ['switch_1'];
  const anyOn = effectiveKeys.some(k => !!st[k]);

  const card = document.createElement('div');
  card.className = `device-card ${online ? 'online' : 'offline'}`;
  card.dataset.deviceId = id;

  const isAC      = shIsAC(category);
  const isFan     = shIsFan(category);
  const isCurtain = shIsCurtain(category);

  const brightPct = hasBright ? Math.round((st.bright_value / 1000) * 100) : 100;
  const togglesHtml = effectiveKeys.map((k, i) => {
    const isOn = !!st[k];
    const label = shToggleLabel(k, i, effectiveKeys.length, isOn, online);
    return `
    <div class="device-toggle-row">
      <span class="device-toggle-label">${escHtml(label)}</span>
      <label class="toggle-switch">
        <input type="checkbox" class="sh-toggle" data-id="${escHtml(id)}" data-key="${escHtml(k)}"
          ${isOn ? 'checked' : ''} ${online ? '' : 'disabled'}>
        <span class="toggle-track"></span>
      </label>
    </div>`;
  }).join('');

  // AC controls
  const acTempSet  = st.temp_set ?? st.temp_set_f;
  const acMode     = st.mode ?? st.work_mode ?? '';
  const acFanSpeed = st.fan_speed_enum ?? st.windspeed ?? '';
  const acModesHtml = isAC ? AC_MODES.map(m =>
    `<button class="sh-mode-btn ${acMode === m ? 'active' : ''}" data-id="${escHtml(id)}" data-cmd="mode" data-val="${m}" ${online && anyOn ? '' : 'disabled'}>${m[0].toUpperCase() + m.slice(1)}</button>`
  ).join('') : '';
  const acFanHtml = isAC ? FAN_SPEEDS.map(s =>
    `<button class="sh-mode-btn ${acFanSpeed === s ? 'active' : ''}" data-id="${escHtml(id)}" data-cmd="fan_speed_enum" data-val="${s}" ${online && anyOn ? '' : 'disabled'}>${s[0].toUpperCase() + s.slice(1)}</button>`
  ).join('') : '';

  // Fan speed controls
  const fanSpeed = st.fan_speed_percent ?? null;
  const fanSpeedEnum = st.fan_speed_enum ?? st.windspeed ?? '';
  const fanSpeedHtml = isFan && fanSpeed !== null ? `
    <div class="device-slider-row">
      <div class="device-slider-label"><span>Speed</span><span class="sh-fan-val">${fanSpeed}%</span></div>
      <input type="range" class="device-slider sh-fanspeed" data-id="${escHtml(id)}"
        min="1" max="100" value="${fanSpeed}" ${online && anyOn ? '' : 'disabled'}>
    </div>` : (isFan && fanSpeedEnum ? `
    <div class="sh-mode-group">
      ${FAN_SPEEDS.filter(s => ['low','medium','high'].includes(s)).map(s =>
        `<button class="sh-mode-btn ${fanSpeedEnum === s ? 'active' : ''}" data-id="${escHtml(id)}" data-cmd="fan_speed_enum" data-val="${s}" ${online && anyOn ? '' : 'disabled'}>${s[0].toUpperCase() + s.slice(1)}</button>`
      ).join('')}
    </div>` : '');

  // Curtain controls
  const curtainPct = st.percent_control ?? null;
  const curtainHtml = isCurtain ? `
    <div class="sh-curtain-btns">
      <button class="sh-curtain-btn" data-id="${escHtml(id)}" data-cmd="control" data-val="open" ${online ? '' : 'disabled'}>▲ Open</button>
      <button class="sh-curtain-btn" data-id="${escHtml(id)}" data-cmd="control" data-val="stop" ${online ? '' : 'disabled'}>■ Stop</button>
      <button class="sh-curtain-btn" data-id="${escHtml(id)}" data-cmd="control" data-val="close" ${online ? '' : 'disabled'}>▼ Close</button>
    </div>
    ${curtainPct !== null ? `
    <div class="device-slider-row">
      <div class="device-slider-label"><span>Position</span><span class="sh-curtain-val">${curtainPct}%</span></div>
      <input type="range" class="device-slider sh-curtainpos" data-id="${escHtml(id)}"
        min="0" max="100" value="${curtainPct}" ${online ? '' : 'disabled'}>
    </div>` : ''}` : '';

  card.innerHTML = `
    <div class="device-card-header">
      <div class="device-icon">${shIcon(category)}</div>
      <div class="device-name">${escHtml(name)}</div>
      <div class="device-status-dot ${online ? 'online' : 'offline'}" title="${online ? 'Online' : 'Offline'}"></div>
    </div>
    ${isCurtain ? curtainHtml : `
      ${togglesHtml}
      ${hasBright ? `
      <div class="device-slider-row">
        <div class="device-slider-label">
          <span>Brightness</span>
          <span class="sh-bright-val">${brightPct}%</span>
        </div>
        <input type="range" class="device-slider sh-brightness" data-id="${escHtml(id)}"
          min="10" max="1000" value="${st.bright_value}" ${online && anyOn ? '' : 'disabled'}>
      </div>` : ''}
      ${hasTemp ? `
      <div class="device-slider-row">
        <div class="device-slider-label"><span>Warm</span><span>Cool</span></div>
        <input type="range" class="device-slider sh-colortemp" data-id="${escHtml(id)}"
          min="0" max="1000" value="${st.temp_value}" ${online && anyOn ? '' : 'disabled'}>
      </div>` : ''}
      ${isAC && acTempSet !== undefined ? `
      <div class="device-slider-row">
        <div class="device-slider-label"><span>Temperature</span><span class="sh-actemp-val">${acTempSet}°</span></div>
        <input type="range" class="device-slider sh-actemp" data-id="${escHtml(id)}"
          min="16" max="30" step="1" value="${acTempSet}" ${online && anyOn ? '' : 'disabled'}>
      </div>` : ''}
      ${isAC && acModesHtml ? `<div class="sh-control-label">Mode</div><div class="sh-mode-group">${acModesHtml}</div>` : ''}
      ${isAC && acFanHtml ? `<div class="sh-control-label">Fan</div><div class="sh-mode-group">${acFanHtml}</div>` : ''}
      ${fanSpeedHtml}
    `}
  `;
  return card;
}

function updateCardControls(deviceId) {
  const card = document.querySelector(`.device-card[data-device-id="${deviceId}"]`);
  if (!card) return;
  const st = shStatuses[deviceId] || {};
  const effectiveKeys = shSwitchKeys(st);
  const anyOn = effectiveKeys.some(k => !!st[k]);

  card.querySelectorAll('.sh-toggle').forEach((tog, i) => {
    const k   = tog.dataset.key;
    const isOn = !!st[k];
    tog.checked = isOn;
    const row = tog.closest('.device-toggle-row');
    const lbl = row && row.querySelector('.device-toggle-label');
    if (lbl) lbl.textContent = shToggleLabel(k, i, effectiveKeys.length, isOn, true);
  });

  const bSlider = card.querySelector('.sh-brightness');
  if (bSlider && st.bright_value !== undefined) {
    bSlider.value    = st.bright_value;
    bSlider.disabled = !anyOn;
    const bVal = card.querySelector('.sh-bright-val');
    if (bVal) bVal.textContent = Math.round((st.bright_value / 1000) * 100) + '%';
  }
  const tSlider = card.querySelector('.sh-colortemp');
  if (tSlider && st.temp_value !== undefined) {
    tSlider.value    = st.temp_value;
    tSlider.disabled = !anyOn;
  }
}

function flashCard(deviceId) {
  const card = document.querySelector(`.device-card[data-device-id="${deviceId}"]`);
  if (!card) return;
  card.classList.add('flash-ok');
  setTimeout(() => card.classList.remove('flash-ok'), 600);
}

// Toggle on/off via event delegation
document.getElementById('device-grid').addEventListener('change', async e => {
  if (!e.target.classList.contains('sh-toggle')) return;
  const id        = e.target.dataset.id;
  const switchKey = e.target.dataset.key || 'switch_1';
  const newVal    = e.target.checked;
  const card      = e.target.closest('.device-card');

  // Optimistic: update this row's label (single-switch: On/Off, multi-switch: keep channel name)
  const row = e.target.closest('.device-toggle-row');
  const lbl = row && row.querySelector('.device-toggle-label');
  if (lbl && (lbl.textContent === 'On' || lbl.textContent === 'Off')) {
    lbl.textContent = newVal ? 'On' : 'Off';
  }

  // Optimistic: recompute anyOn to enable/disable sliders
  const st = shStatuses[id] || {};
  const simulatedSt = { ...st, [switchKey]: newVal };
  const anyOn = shSwitchKeys(simulatedSt).some(k => !!simulatedSt[k]) || newVal;
  const bSlider = card && card.querySelector('.sh-brightness');
  const tSlider = card && card.querySelector('.sh-colortemp');
  if (bSlider) bSlider.disabled = !anyOn;
  if (tSlider) tSlider.disabled = !anyOn;

  shPendingControls[id] = true;
  try {
    await shFetch(`/api/devices/${encodeURIComponent(id)}/control`, {
      method: 'POST',
      body: JSON.stringify({ commands: { [switchKey]: newVal } }),
    });
    shStatuses[id] = { ...st, [switchKey]: newVal };
    flashCard(id);
  } catch {
    e.target.checked = !newVal;
    if (lbl && (lbl.textContent === 'On' || lbl.textContent === 'Off')) {
      lbl.textContent = !newVal ? 'On' : 'Off';
    }
    if (bSlider) bSlider.disabled = anyOn;
    if (tSlider) tSlider.disabled = anyOn;
  } finally {
    delete shPendingControls[id];
  }
});

// Sliders with 400ms debounce
const shSliderDebounce = {};
document.getElementById('device-grid').addEventListener('input', e => {
  if (e.target.classList.contains('sh-brightness')) {
    const id  = e.target.dataset.id;
    const val = parseInt(e.target.value);
    const card = e.target.closest('.device-card');
    const disp = card && card.querySelector('.sh-bright-val');
    if (disp) disp.textContent = Math.round((val / 1000) * 100) + '%';
    clearTimeout(shSliderDebounce[id + '_b']);
    shSliderDebounce[id + '_b'] = setTimeout(async () => {
      shPendingControls[id] = true;
      try {
        await shFetch(`/api/devices/${encodeURIComponent(id)}/control`, {
          method: 'POST',
          body: JSON.stringify({ commands: { bright_value: val } }),
        });
        shStatuses[id] = { ...(shStatuses[id] || {}), bright_value: val };
      } catch { /* corrected on next refresh */ }
      finally { delete shPendingControls[id]; }
    }, 400);
  }
  if (e.target.classList.contains('sh-colortemp')) {
    const id  = e.target.dataset.id;
    const val = parseInt(e.target.value);
    clearTimeout(shSliderDebounce[id + '_t']);
    shSliderDebounce[id + '_t'] = setTimeout(async () => {

        shStatuses[id] = { ...(shStatuses[id] || {}), temp_value: val };
      } catch { /* corrected on next refresh */ }
      finally { delete shPendingControls[id]; }
    }, 400);
  }
  // AC temperature slider
  if (e.target.classList.contains('sh-actemp')) {
    const id  = e.target.dataset.id;
    const val = parseInt(e.target.value);
    const card = e.target.closest('.device-card');
    const disp = card && card.querySelector('.sh-actemp-val');
    if (disp) disp.textContent = val + '°';
    clearTimeout(shSliderDebounce[id + '_actemp']);
    shSliderDebounce[id + '_actemp'] = setTimeout(async () => {
      shPendingControls[id] = true;
      try {
        await shFetch(`/api/devices/${encodeURIComponent(id)}/control`, {
          method: 'POST',
          body: JSON.stringify({ commands: { temp_set: val } }),
        });
        shStatuses[id] = { ...(shStatuses[id] || {}), temp_set: val };
      } catch { /* corrected on next refresh */ }
      finally { delete shPendingControls[id]; }
    }, 400);
  }
  // Fan speed % slider
  if (e.target.classList.contains('sh-fanspeed')) {
    const id  = e.target.dataset.id;
    const val = parseInt(e.target.value);
    const card = e.target.closest('.device-card');
    const disp = card && card.querySelector('.sh-fan-val');
    if (disp) disp.textContent = val + '%';
    clearTimeout(shSliderDebounce[id + '_fan']);
    shSliderDebounce[id + '_fan'] = setTimeout(async () => {
      shPendingControls[id] = true;
      try {
        await shFetch(`/api/devices/${encodeURIComponent(id)}/control`, {
          method: 'POST',
          body: JSON.stringify({ commands: { fan_speed_percent: val } }),
        });
        shStatuses[id] = { ...(shStatuses[id] || {}), fan_speed_percent: val };
      } catch { /* corrected on next refresh */ }
      finally { delete shPendingControls[id]; }
    }, 400);
  }
  // Curtain position slider
  if (e.target.classList.contains('sh-curtainpos')) {
    const id  = e.target.dataset.id;
    const val = parseInt(e.target.value);
    const card = e.target.closest('.device-card');
    const disp = card && card.querySelector('.sh-curtain-val');
    if (disp) disp.textContent = val + '%';
    clearTimeout(shSliderDebounce[id + '_curtain']);
    shSliderDebounce[id + '_curtain'] = setTimeout(async () => {
      shPendingControls[id] = true;
      try {
        await shFetch(`/api/devices/${encodeURIComponent(id)}/control`, {
          method: 'POST',
          body: JSON.stringify({ commands: { percent_control: val } }),
        });
        shStatuses[id] = { ...(shStatuses[id] || {}), percent_control: val };
      } catch { /* corrected on next refresh */ }
      finally { delete shPendingControls[id]; }
    }, 400);
  }
});

// Mode buttons (AC mode, fan speed enum) and curtain open/stop/close
document.getElementById('device-grid').addEventListener('click', async e => {
  const modeBtn    = e.target.closest('.sh-mode-btn');
  const curtainBtn = e.target.closest('.sh-curtain-btn');
  const btn = modeBtn || curtainBtn;
  if (!btn || btn.disabled) return;

  const id  = btn.dataset.id;
  const cmd = btn.dataset.cmd;
  const val = btn.dataset.val;

  btn.disabled = true;
  shPendingControls[id] = true;
  try {
    await shFetch(`/api/devices/${encodeURIComponent(id)}/control`, {
      method: 'POST',
      body: JSON.stringify({ commands: { [cmd]: val } }),
    });
    shStatuses[id] = { ...(shStatuses[id] || {}), [cmd]: val };
    flashCard(id);
    // Update active state on sibling buttons
    if (modeBtn) {
      const group = modeBtn.closest('.sh-mode-group');
      if (group) group.querySelectorAll('.sh-mode-btn[data-cmd="' + cmd + '"]').forEach(b => {
        b.classList.toggle('active', b.dataset.val === val);
      });
    }
  } catch { /* silent — refresh will correct */ }
  finally {
    btn.disabled = false;
    delete shPendingControls[id];
  }
});

function showUpdateToast(registration) {
  if (document.getElementById('update-toast')) return; // already shown
  const toast = document.createElement('div');
  toast.id = 'update-toast';
  toast.innerHTML = `
    <span>✨ New version available</span>
    <button id="update-btn">Update</button>
  `;
  document.body.appendChild(toast);

  document.getElementById('update-btn').addEventListener('click', () => {
    toast.remove();
    // Tell the waiting SW to skip waiting — triggers controllerchange → reload.
    if (registration.waiting) registration.waiting.postMessage('SKIP_WAITING');
  });
}
